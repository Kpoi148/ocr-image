<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>OCR Text Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7V5C3 3.89543 3.89543 3 5 3H7M17 3H19C20.1046 3 21 3.89543 21 5V7M21 17V19C21 20.1046 20.1046 21 19 21H17M7 21H5C3.89543 21 3 20.1046 3 19V17M10 9H14M12 9V15M9 15H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Smart OCR</h1>
      </div>
    </header>

    <main class="app-content">
      <div id="dropZone" class="drop-zone" role="button" tabindex="0">
        <div class="drop-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 12v9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 16l-4-4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="drop-text">
          <strong>Kéo thả ảnh</strong> hoặc <span>Copy/Paste</span>
        </div>
        <div class="drop-file" id="dropFileName"></div>
      </div>
      <input type="file" id="imageUpload" accept="image/*" hidden>

      <button id="extractButton" class="btn-primary">
        <span>Trích xuất Text</span>
      </button>

      <div id="progressContainer" class="progress-container" style="display: none;">
        <div class="progress-info">
          <span id="progressStatus">Đang xử lý...</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div class="result-area">
        <div class="result-header">
          <label>Kết quả trích xuất</label>
          <div class="result-actions">
            <button id="resetBtn" class="btn-icon btn-icon--danger" title="Xóa kết quả">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
              </svg>
              Xóa kết quả
            </button>
            <button id="copyBtn" class="btn-icon" title="Copy Text">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              Copy
            </button>
          </div>
        </div>
        <textarea id="resultText" placeholder="Nội dung văn bản sẽ xuất hiện tại đây..." spellcheck="false"></textarea>
      </div>
    </main>
  </div>
  <script src="../shared/actions.js"></script>
  <script src="../shared/image-store.js"></script>
  <script src="../shared/ocr-state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
